version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opony_dev
      POSTGRES_USER: opony
      POSTGRES_PASSWORD: opony_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP

volumes:
  postgres_data:
